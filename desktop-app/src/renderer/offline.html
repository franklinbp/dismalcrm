<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DismalCRM Desktop - Offline</title>
    <style>
      :root {
        --bg: #020702;
        --card: #081508;
        --line: rgba(84, 255, 84, 0.35);
        --text: #97ff97;
        --accent: #54ff54;
      }
      * {
        box-sizing: border-box;
        font-family: "JetBrains Mono", "Fira Code", monospace;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top right, #103010 0%, var(--bg) 45%);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(720px, 100%);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 20px;
        box-shadow: 0 0 24px rgba(84, 255, 84, 0.12);
      }
      .title {
        margin: 0 0 8px 0;
        color: var(--accent);
      }
      .meta {
        margin: 0 0 14px 0;
        opacity: 0.8;
      }
      .grid {
        display: grid;
        gap: 12px;
      }
      .label {
        font-size: 12px;
      }
      input {
        width: 100%;
        background: #031003;
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 8px;
        padding: 10px;
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 8px;
      }
      button {
        border: 1px solid var(--line);
        background: #072007;
        color: var(--accent);
        border-radius: 8px;
        padding: 10px 14px;
        cursor: pointer;
      }
      button:hover {
        background: #0a280a;
      }
      .err {
        margin-top: 10px;
        font-size: 12px;
        opacity: 0.85;
      }
      .ok {
        margin-top: 10px;
        font-size: 12px;
        color: #67ffb0;
      }
      .sub {
        margin: 0;
        opacity: 0.8;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2 class="title">DismalCRM Desktop</h2>
      <p class="meta">Configura la conexión de forma simple.</p>
      <p class="sub">Opción A: pega el código de conexión.</p>
      <p class="sub">Opción B: llena los campos manualmente.</p>
      <div class="grid">
        <label class="label" for="connectionCode">Código de conexión (opcional)</label>
        <input id="connectionCode" type="text" placeholder="DCRM1-..." />

        <label class="label" for="connectionName">Nombre del negocio (opcional)</label>
        <input id="connectionName" type="text" placeholder="Dismal Ecuador" />

        <label class="label" for="appUrl">URL del panel web (obligatorio)</label>
        <input id="appUrl" type="text" placeholder="https://app.midominio.com" />

        <label class="label" for="backendUrl">URL del backend/API (opcional)</label>
        <input id="backendUrl" type="text" placeholder="https://api.midominio.com" />
      </div>
      <div class="actions">
        <button id="saveAndRetry">Guardar y Conectar</button>
        <button id="justRetry">Solo Reintentar</button>
        <button id="openSettings">Abrir Configuracion</button>
      </div>
      <p class="err" id="errorLine"></p>
      <p class="ok" id="okLine"></p>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const failedUrl = params.get("failedUrl") || "http://localhost:3002";
      const code = params.get("code") || "";
      const reason = params.get("reason") || "";

      const connectionCodeInput = document.getElementById("connectionCode");
      const connectionNameInput = document.getElementById("connectionName");
      const appUrlInput = document.getElementById("appUrl");
      const backendUrlInput = document.getElementById("backendUrl");
      const errorLine = document.getElementById("errorLine");
      const okLine = document.getElementById("okLine");
      const saveAndRetryButton = document.getElementById("saveAndRetry");
      const justRetryButton = document.getElementById("justRetry");
      const openSettingsButton = document.getElementById("openSettings");

      const hydrate = async () => {
        const settings = await window.desktopAPI.getSettings();
        connectionNameInput.value = settings.connectionName || "";
        appUrlInput.value = settings.appUrl || failedUrl;
        backendUrlInput.value = settings.backendUrl || "";
      };

      hydrate();

      errorLine.textContent = `Error: [${code}] ${reason}`;

      saveAndRetryButton.addEventListener("click", async () => {
        errorLine.textContent = "";
        okLine.textContent = "";
        try {
          const result = await window.desktopAPI.setConnection({
            code: connectionCodeInput.value.trim(),
            connectionName: connectionNameInput.value.trim(),
            appUrl: appUrlInput.value.trim(),
            backendUrl: backendUrlInput.value.trim()
          });
          okLine.textContent = `Conexión guardada. Abriendo: ${result.appUrl}`;
          window.location.reload();
        } catch (err) {
          errorLine.textContent = err.message || "No se pudo guardar la configuración.";
        }
      });

      justRetryButton.addEventListener("click", () => {
        errorLine.textContent = "";
        okLine.textContent = "";
        window.desktopAPI
          .retryLoad()
          .catch((err) => {
            errorLine.textContent = err.message || "No se pudo reintentar la conexion.";
          });
      });

      openSettingsButton.addEventListener("click", () => {
        window.desktopAPI.openSettings();
      });
    </script>
  </body>
</html>
