<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DismalCRM Desktop - Configuracion</title>
    <style>
      :root {
        --bg: #020702;
        --card: #081508;
        --line: rgba(84, 255, 84, 0.35);
        --text: #97ff97;
        --accent: #54ff54;
      }
      * {
        box-sizing: border-box;
        font-family: "JetBrains Mono", "Fira Code", monospace;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top right, #103010 0%, var(--bg) 45%);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 20px;
      }
      .card {
        width: min(520px, 100%);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px;
      }
      .title {
        margin: 0 0 8px 0;
        color: var(--accent);
      }
      .meta {
        margin: 0 0 14px 0;
        opacity: 0.8;
      }
      .grid {
        display: grid;
        gap: 12px;
      }
      .label {
        font-size: 12px;
      }
      input {
        width: 100%;
        background: #031003;
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 8px;
        padding: 10px;
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 12px;
      }
      button {
        border: 1px solid var(--line);
        background: #072007;
        color: var(--accent);
        border-radius: 8px;
        padding: 10px 14px;
        cursor: pointer;
      }
      .err {
        margin-top: 10px;
        font-size: 12px;
        opacity: 0.85;
      }
      .ok {
        margin-top: 10px;
        font-size: 12px;
        color: #67ffb0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2 class="title">Configuracion de conexion</h2>
      <p class="meta">Puedes cambiar estos datos en cualquier momento.</p>
      <div class="grid">
        <label class="label" for="connectionCode">Codigo de conexion (opcional)</label>
        <input id="connectionCode" type="text" placeholder="DCRM1-..." />

        <label class="label" for="connectionName">Nombre del negocio (opcional)</label>
        <input id="connectionName" type="text" placeholder="Dismal Ecuador" />

        <label class="label" for="appUrl">URL del panel web (obligatorio)</label>
        <input id="appUrl" type="text" placeholder="https://app.midominio.com" />

        <label class="label" for="backendUrl">URL del backend/API (opcional)</label>
        <input id="backendUrl" type="text" placeholder="https://api.midominio.com" />
      </div>

      <div class="actions">
        <button id="save">Guardar y Reconectar</button>
        <button id="cancel">Cerrar</button>
      </div>

      <p class="err" id="errorLine"></p>
      <p class="ok" id="okLine"></p>
    </div>

    <script>
      const connectionCodeInput = document.getElementById("connectionCode");
      const connectionNameInput = document.getElementById("connectionName");
      const appUrlInput = document.getElementById("appUrl");
      const backendUrlInput = document.getElementById("backendUrl");
      const errorLine = document.getElementById("errorLine");
      const okLine = document.getElementById("okLine");

      const hydrate = async () => {
        const settings = await window.desktopAPI.getSettings();
        connectionNameInput.value = settings.connectionName || "";
        appUrlInput.value = settings.appUrl || "";
        backendUrlInput.value = settings.backendUrl || "";
      };

      hydrate();

      document.getElementById("save").addEventListener("click", async () => {
        errorLine.textContent = "";
        okLine.textContent = "";

        try {
          const result = await window.desktopAPI.setConnection({
            code: connectionCodeInput.value.trim(),
            connectionName: connectionNameInput.value.trim(),
            appUrl: appUrlInput.value.trim(),
            backendUrl: backendUrlInput.value.trim()
          });

          okLine.textContent = `Configuracion guardada. Conectando a: ${result.appUrl}`;
          setTimeout(() => {
            window.desktopAPI.closeSettings();
          }, 350);
        } catch (err) {
          errorLine.textContent = err.message || "No se pudo guardar la configuracion.";
        }
      });

      document.getElementById("cancel").addEventListener("click", () => {
        window.desktopAPI.closeSettings();
      });
    </script>
  </body>
</html>
